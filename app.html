<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AppMultiplicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Variables de color */
            --color-gold: #e2a628;
            --color-blue: #2a69a0;
            --color-teal: #1e9fb3;
            --color-dark: #0a2038;
            --color-bg: #f8fafc;
            
            /* Variables del panel inferior y modal */
            --azul-oscuro: #0a192f;
            --rojo-alerta: #d63031;
            --naranja-resalte: #ff9f43;
            --gris-claro: #f1f2f6;
            --texto-principal: #0a192f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            width: 100%;
        }

        /* --- TARJETAS DE SELECCIÓN --- */
        .home-container {
            display: flex;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-card {
            background: white;
            flex: 1;
            min-width: 250px;
            padding: 3rem 1rem;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 6px solid var(--color-gold);
        }

        .category-card.blue { border-color: var(--color-blue); }
        .category-card.teal { border-color: var(--color-teal); }
        
        .category-card h2 { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; text-transform: uppercase; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }

        /* --- MODAL GENERAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 32, 56, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            width: 95vw;
            height: 90vh;
            background: var(--color-bg);
            border-radius: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .btn-close {
            position: absolute;
            top: 15px; right: 15px;
            background: var(--color-gold);
            border: none;
            width: 35px; height: 35px;
            border-radius: 50%;
            color: white; font-weight: bold; cursor: pointer; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        /* --- PANEL INFERIOR --- */
        .bottom-panel {
            background-color: var(--azul-oscuro);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            position: relative;
            z-index: 110;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .info-text {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-text, .mobile-brand {
            color: white;
            font-weight: 800;
            font-size: clamp(0.85rem, 4vw, 1.1rem);
        }

        /* Botón Agenda */
        .btn-agenda {
            background-color: var(--color-gold);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        .btn-agenda:hover { background-color: #c99320; }

        .right-group { display: flex; align-items: center; gap: 15px; }

        /* Estilo para el contenedor del iframe de la Agenda */
        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .brand-text { display: none; }
            .mobile-brand { display: inline-block; }
        }

        /* Estilos de los diagramas se mantienen igual que en tu archivo original */
        .diagram-viewport { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .scaling-wrapper { display: flex; align-items: center; justify-content: center; transform-origin: center; width: 100%; height: 100%; }
        .nodes-container { display: flex; align-items: center; gap: 0; }
        .node-item { position: relative; margin-left: -40px; }
        .node-item:first-child { margin-left: 0; }
        .node-item.down { transform: translateY(80px); }
        .node-item.up { transform: translateY(-80px); }
        .diamond { width: 160px; height: 160px; background: white; transform: rotate(45deg); border: 5px solid var(--color-gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px var(--color-bg), 0 8px 15px rgba(0,0,0,0.1); }
        .diamond .content { transform: rotate(-45deg); text-align: center; width: 140px; padding: 5px; }
        .diamond .content h4 { font-size: 0.75rem; font-weight: 800; line-height: 1.1; text-transform: uppercase; }
        .diamond .content p { font-size: 0.65rem; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="home-container">
            <div class="category-card" onclick="openModal('modal-mas')">
                <h2>MÁS<br>IGLESIAS</h2>
            </div>
            <div class="category-card blue" onclick="openModal('modal-mejores')">
                <h2 style="color: var(--color-blue);">MEJORES<br>IGLESIAS</h2>
            </div>
            <div class="category-card teal" onclick="openModal('modal-proceso')">
                <h2 style="color: var(--color-teal);">PROCESO DE<br>MULTIPLICACIÓN</h2>
            </div>
        </div>
    </main>

    <footer class="bottom-panel">
        <div class="info-text">
            <span class="brand-text">Red de Multiplicación</span>
            <span class="mobile-brand">Red Multiplicación</span>
            <button class="btn-agenda" onclick="openModal('modal-agenda')">Agenda</button>
        </div>
        <div class="right-group">
            <button class="btn-logout-panel" onclick="openModal('exit-modal')" title="Salir del Sistema">
                <svg style="width:28px;height:28px;fill:var(--naranja-resalte);" viewBox="0 0 16 16">
                    <path d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
                    <path d="M4 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1a1 1 0 0 0-2 0v1H4V3h6v1a1 1 0 0 0 2 0V3a2 2 0 0 0-2-2H4z"/>
                </svg>
            </button>
        </div>
    </footer>

    <div id="modal-agenda" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal('modal-agenda')">&times;</button>
            <div style="padding: 20px; text-align: center;">
                <h2 style="color: var(--color-gold); text-transform: uppercase; font-size: 1.5rem;">Agenda</h2>
            </div>
            <div class="iframe-container">
                <iframe src="https://experiencia-ia.github.io/boillat/agenda.html"></iframe>
            </div>
        </div>
    </div>

    <div id="modal-mas" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal('modal-mas')">&times;</button>
            <div class="diagram-viewport">
                </div>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        function confirmExit() {
            window.location.href = 'index.html';
        }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        }
    </script>
</body>
</html>
