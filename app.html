<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sistema de Gestión | Iglesia Evangélica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 24px 20px;
            color: #0f172a;
            font-weight: 400;
        }

        .app-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 1.75rem 2rem 2rem 2rem;
            transition: all 0.2s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e2e8f0;
        }
        .title-section h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.3px;
            margin-bottom: 0;
        }
        .action-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .welcome-highlight {
            font-size: 1rem;
            font-weight: 700;
            color: #2563eb;
            background: #eff6ff;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: -0.2px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-primary-action {
            background: #2563eb;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary-action:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-logout {
            background: #dc2626;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background: #b91c1c;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 28px;
            margin-top: 6px;
        }

        .filters-toggle {
            display: none;
            margin-bottom: 16px;
        }
        .btn-filters {
            width: 100%;
            background: #166534;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-filters:hover {
            background: #14532d;
        }

        .mobile-filters-container {
            display: none;
            margin-bottom: 20px;
            animation: fadeSlide 0.2s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-filters-container .filters-card {
            margin: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .filters-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid #edf2f7;
            height: fit-content;
        }
        .filters-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 1.2rem;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
        }
        .filter-group {
            margin-bottom: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .filter-group label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #334155;
            text-transform: uppercase;
        }
        .filter-group input, .filter-group select {
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .filter-group input:focus, .filter-group select:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .buttons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 18px;
        }
        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 8px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            color: white;
            flex: 1;
            text-align: center;
        }
        .btn-primary-outline {
            background: transparent;
            border: 1px solid #3b82f6;
            color: #1e40af;
            padding: 8px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .reset-btn {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        .stats-badge {
            background: #f8fafc;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.7rem;
            font-weight: 500;
            text-align: center;
            margin-top: 12px;
            color: #334155;
            border-top: 1px solid #eef2f8;
        }

        .table-container {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #eef2f6;
            overflow: hidden;
        }
        .table-wrapper {
            overflow-x: auto;
            max-height: 60vh;
            overflow-y: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 980px;
        }
        .data-table th {
            background: #1e293b;
            color: #f8fafc;
            padding: 14px 12px;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .data-table td {
            padding: 12px 12px;
            border-bottom: 1px solid #eef2f8;
            color: #1e293b;
            cursor: pointer;
            transition: background 0.15s;
        }
        .data-table tr:hover td {
            background-color: #f8fafc;
        }
        .phone-link {
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
        }
        .phone-link:hover {
            text-decoration: underline;
            color: #2563eb;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px;
            background: #ffffff;
            border-top: 1px solid #eef2f8;
        }
        .pagination-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pagination-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .pagination-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .pagination-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .page-info {
            font-size: 0.75rem;
            color: #475569;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s ease;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-container {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeScale 0.2s ease;
        }
        @keyframes fadeScale {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            background: #1e293b;
            color: white;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            color: white;
            opacity: 0.8;
        }
        .close-modal:hover {
            opacity: 1;
        }
        .modal-body {
            padding: 22px 26px;
            max-height: 65vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e293b;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .detail-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 10px;
        }
        .badge-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .status-pendiente { background: #ffedd5; color: #9a3412; }
        .status-proceso { background: #dbeafe; color: #1e40af; }
        .status-cumplido { background: #dcfce7; color: #166534; }
        .small-note {
            font-size: 0.7rem;
            color: #5b6e8c;
            margin-top: 12px;
            text-align: center;
            border-top: 1px solid #edf2f7;
            padding-top: 12px;
        }
        .btn-print-detail {
            background: #475569;
            margin-bottom: 20px;
            width: 100%;
        }

        @media (max-width: 880px) {
            body { padding: 16px; }
            .app-wrapper { padding: 1.2rem; }
            .dashboard-grid { grid-template-columns: 1fr; gap: 0; }
            .dashboard-grid .filters-card { display: none; }
            .filters-toggle { display: block; }
            .table-wrapper { max-height: 55vh; }
            .header-bar { flex-direction: column; align-items: stretch; }
            .action-group { justify-content: space-between; width: 100%; }
            .welcome-highlight { font-size: 0.9rem; padding: 5px 12px; }
            .pagination-container { flex-direction: column; align-items: center; }
            .modal-body { padding: 18px; }
            .detail-row { grid-template-columns: 1fr; gap: 4px; }
        }
        @media (max-width: 560px) {
            .action-group { flex-direction: column; align-items: stretch; gap: 10px; }
            .action-buttons { justify-content: stretch; }
            .welcome-highlight { text-align: center; }
        }
        @media print {
            .filters-card, .filters-toggle, .action-group, .pagination-container, .stats-badge, .modal-header .close-modal, .btn-print-detail { display: none; }
            .table-container { border: 1px solid #ccc; }
            .modal-overlay { position: relative; visibility: visible; opacity: 1; background: white; backdrop-filter: none; }
            .modal-container { box-shadow: none; width: 100%; max-width: 100%; border-radius: 0; }
            .modal-header { background: #e2e8f0; color: black; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="header-bar">
        <div class="title-section">
            <h1>Tabla de Registro</h1>
        </div>
        <div class="action-group">
            <div class="welcome-highlight">Hola, bienvenido al sistema de gestión.</div>
            <div class="action-buttons">
                <button class="btn-primary-action" id="nuevoRegistroBtn">Nuevo Registro</button>
                <button class="btn-primary-action" id="mapaBtn">Mapa</button>
                <button class="btn-primary-action" id="agendaBtn">Agenda</button>
                <button class="btn-logout" id="salirBtn">Salir</button>
            </div>
        </div>
    </div>

    <div class="filters-toggle">
        <button class="btn-filters" id="toggleFiltersBtn">Filtros</button>
    </div>
    <div id="mobileFiltersContainer" class="mobile-filters-container"></div>

    <div class="dashboard-grid">
        <div class="table-container">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr><th>Número</th><th>Apellido</th><th>Nombre</th><th>Edad</th><th>Iglesia</th><th>Domicilio</th><th>Ciudad</th><th>Perfil</th><th>Observaciones</th><th>Teléfono</th></tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr><td colspan="10" style="text-align:center">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container" id="paginationContainer">
                <div class="page-info" id="pageInfo">Mostrando 0-0 de 0 registros</div>
                <div class="pagination-controls" id="paginationControls"></div>
            </div>
            <div class="stats-badge" id="contadorRegistros">Total registros: 0</div>
        </div>

        <div class="filters-card" id="desktopFiltersCard">
            <h3>Filtros avanzados</h3>
            <div class="filter-group"><label>Búsqueda global</label><input type="text" id="filtroGeneral" placeholder="Nombre, iglesia, ciudad..."></div>
            <div class="filter-group"><label>Módulo cumplido</label><select id="filtroModulo"><option value="">Todos los módulos</option></select></div>
            <div class="filter-group"><label>Iglesia</label><select id="filtroIglesia"><option value="">Todas las iglesias</option></select></div>
            <div class="filter-group"><label>Ciudad</label><select id="filtroCiudad"><option value="">Todas las ciudades</option></select></div>
            <div class="filter-group"><label>Estado actual</label><select id="filtroEstado"><option value="">Todos</option><option value="Pendiente">Pendiente</option><option value="En proceso">En proceso</option><option value="Cumplido">Cumplido</option></select></div>
            <div class="buttons-group"><button class="btn-primary-outline" id="imprimirCompletaBtn">Imprimir tabla completa</button><button class="btn-primary-outline" id="imprimirFiltradaBtn">Imprimir filtrada</button></div>
            <div class="buttons-group"><button class="btn-primary reset-btn" id="limpiarFiltrosBtn">Limpiar filtros</button></div>
            <div class="small-note">Haz clic en cualquier fila para ver detalles.</div>
        </div>
    </div>
</div>

<!-- Modal Nuevo Registro (incluye teléfono) -->
<div id="nuevoModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3>Nuevo Registro</h3><button class="close-modal" id="closeNuevoModalBtn">&times;</button></div>
        <div class="modal-body">
            <form id="nuevoForm">
                <div class="form-group"><label>Apellido *</label><input type="text" id="nuevoApellido" required></div>
                <div class="form-group"><label>Nombre *</label><input type="text" id="nuevoNombre" required></div>
                <div class="form-group"><label>Edad *</label><input type="number" id="nuevoEdad" required></div>
                <div class="form-group"><label>Iglesia *</label><input type="text" id="nuevoIglesia" required></div>
                <div class="form-group"><label>Domicilio</label><input type="text" id="nuevoDomicilio"></div>
                <div class="form-group"><label>Ciudad *</label><input type="text" id="nuevoCiudad" required></div>
                <div class="form-group"><label>Perfil</label><input type="text" id="nuevoPerfil"></div>
                <div class="form-group"><label>Observaciones</label><textarea id="nuevoObservaciones" rows="2"></textarea></div>
                <div class="form-group"><label>Teléfono</label><input type="tel" id="nuevoTelefono" placeholder="Ej: +54 9 11 1234-5678"></div>
                <div class="form-group"><label>Módulos cumplidos (separados por coma)</label><input type="text" id="nuevoModulos" placeholder="Ej: Discipulado, Evangelismo"></div>
                <div class="form-group"><label>Fecha inicio módulo</label><input type="date" id="nuevoFechaInicio"></div>
                <div class="form-group"><label>Estado actual</label><select id="nuevoEstado"><option value="Pendiente">Pendiente</option><option value="En proceso">En proceso</option><option value="Cumplido">Cumplido</option></select></div>
                <div class="form-actions"><button type="button" class="btn-primary-outline" id="cancelarNuevoBtn">Cancelar</button><button type="submit" class="btn-primary">Guardar</button></div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Detalle (con botón imprimir y teléfono clickeable) -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3>Detalle del registro</h3><button class="close-modal" id="closeModalBtn">&times;</button></div>
        <div class="modal-body" id="modalBodyContent"></div>
    </div>
</div>

<script>
    // SIN DATOS FICTICIOS: Array vacío para que el usuario ingrese registros reales manualmente
    let personas = [];

    // Configuración paginación
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentFilteredData = [];

    function getSortedData(data) {
        return [...data].sort((a, b) => b.numero - a.numero);
    }

    function filtrarRegistros() {
        const texto = document.getElementById('filtroGeneral').value.trim().toLowerCase();
        const moduloVal = document.getElementById('filtroModulo').value;
        const iglesiaVal = document.getElementById('filtroIglesia').value;
        const ciudadVal = document.getElementById('filtroCiudad').value;
        const estadoVal = document.getElementById('filtroEstado').value;
        let filtered = personas.filter(p => {
            if (texto !== "") {
                const match = p.apellido.toLowerCase().includes(texto) || p.nombre.toLowerCase().includes(texto) ||
                              p.iglesia.toLowerCase().includes(texto) || p.domicilio.toLowerCase().includes(texto) ||
                              p.ciudad.toLowerCase().includes(texto) || p.perfil.toLowerCase().includes(texto) ||
                              (p.observaciones && p.observaciones.toLowerCase().includes(texto)) ||
                              (p.telefono && p.telefono.toLowerCase().includes(texto));
                if (!match) return false;
            }
            if (moduloVal !== "") {
                const modulosPersona = p.modulosCumplidos.split(',').map(m => m.trim());
                if (!modulosPersona.includes(moduloVal)) return false;
            }
            if (iglesiaVal !== "" && p.iglesia !== iglesiaVal) return false;
            if (ciudadVal !== "" && p.ciudad !== ciudadVal) return false;
            if (estadoVal !== "" && p.estadoActual !== estadoVal) return false;
            return true;
        });
        return getSortedData(filtered);
    }

    function updateFilteredData() {
        currentFilteredData = filtrarRegistros();
        currentPage = 1;
        renderizarTabla();
        renderizarPaginacion();
    }

    function renderizarTabla() {
        const start = (currentPage - 1) * itemsPerPage;
        const paginated = currentFilteredData.slice(start, start + itemsPerPage);
        const tbody = document.getElementById('tablaBody');
        if (!tbody) return;
        if (paginated.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:28px;">No hay registros. Use "Nuevo Registro" para agregar.</td></tr>';
            document.getElementById('contadorRegistros').innerText = `Total registros: ${currentFilteredData.length}`;
            return;
        }
        let html = '';
        paginated.forEach(p => {
            const telefonoMostrar = p.telefono ? p.telefono : '';
            html += `<tr data-id="${p.id}">
                        <td>${p.numero}</td>
                        <td>${escapeHtml(p.apellido)}</td>
                        <td>${escapeHtml(p.nombre)}</td>
                        <td>${p.edad}</td>
                        <td>${escapeHtml(p.iglesia)}</td>
                        <td>${escapeHtml(p.domicilio)}</td>
                        <td>${escapeHtml(p.ciudad)}</td>
                        <td>${escapeHtml(p.perfil)}</td>
                        <td>${escapeHtml(p.observaciones ? p.observaciones.substring(0, 55) : '')}${p.observaciones && p.observaciones.length > 55 ? '…' : ''}</td>
                        <td>${telefonoMostrar ? `<a href="tel:${encodeURIComponent(telefonoMostrar)}" class="phone-link" onclick="event.stopPropagation()">${escapeHtml(telefonoMostrar)}</a>` : ''}</td>
                    </tr>`;
        });
        tbody.innerHTML = html;
        document.getElementById('contadorRegistros').innerText = `Total registros: ${currentFilteredData.length}`;
        
        document.querySelectorAll('#tablaBody tr[data-id]').forEach(row => {
            row.addEventListener('click', (e) => {
                // Evitar que el clic en el enlace telefónico dispare el modal
                if (e.target.tagName === 'A' && e.target.classList.contains('phone-link')) return;
                const id = parseInt(row.getAttribute('data-id'));
                const persona = personas.find(p => p.id === id);
                if (persona) abrirModalDetalle(persona);
            });
        });
    }

    function renderizarPaginacion() {
        const totalPages = Math.ceil(currentFilteredData.length / itemsPerPage);
        const container = document.getElementById('paginationControls');
        const pageInfo = document.getElementById('pageInfo');
        if (!container) return;
        const startItem = (currentPage - 1) * itemsPerPage + 1;
        const endItem = Math.min(currentPage * itemsPerPage, currentFilteredData.length);
        pageInfo.innerText = `Mostrando ${startItem}-${endItem} de ${currentFilteredData.length} registros`;
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let btnsHtml = `<button class="pagination-btn" id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>Anterior</button>`;
        for (let i = 1; i <= totalPages; i++) btnsHtml += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        btnsHtml += `<button class="pagination-btn" id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>Siguiente</button>`;
        container.innerHTML = btnsHtml;
        document.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', (e) => { currentPage = parseInt(btn.getAttribute('data-page')); renderizarTabla(); renderizarPaginacion(); }));
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderizarTabla(); renderizarPaginacion(); } });
        if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; renderizarTabla(); renderizarPaginacion(); } });
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m==='&') return '&amp;'; if (m==='<') return '&lt;'; if (m==='>') return '&gt;'; return m; }); }

    function cerrarModal(modalId) { const modal = document.getElementById(modalId); if (modal) modal.classList.remove('active'); }
    
    function agregarNuevoRegistro(event) {
        event.preventDefault();
        const nuevoId = personas.length > 0 ? Math.max(...personas.map(p => p.id)) + 1 : 1;
        const nuevoNumero = personas.length > 0 ? Math.max(...personas.map(p => p.numero)) + 1 : 1;
        const nuevaPersona = {
            id: nuevoId, numero: nuevoNumero,
            apellido: document.getElementById('nuevoApellido').value.trim(),
            nombre: document.getElementById('nuevoNombre').value.trim(),
            edad: parseInt(document.getElementById('nuevoEdad').value),
            iglesia: document.getElementById('nuevoIglesia').value.trim(),
            domicilio: document.getElementById('nuevoDomicilio').value.trim(),
            ciudad: document.getElementById('nuevoCiudad').value.trim(),
            perfil: document.getElementById('nuevoPerfil').value.trim(),
            observaciones: document.getElementById('nuevoObservaciones').value.trim(),
            telefono: document.getElementById('nuevoTelefono').value.trim(),
            modulosCumplidos: document.getElementById('nuevoModulos').value.trim(),
            fechaInicioModulo: document.getElementById('nuevoFechaInicio').value,
            estadoActual: document.getElementById('nuevoEstado').value
        };
        if (!nuevaPersona.apellido || !nuevaPersona.nombre || !nuevaPersona.iglesia || !nuevaPersona.ciudad || isNaN(nuevaPersona.edad)) {
            alert("Complete los campos obligatorios: Apellido, Nombre, Edad, Iglesia, Ciudad.");
            return;
        }
        personas.push(nuevaPersona);
        actualizarSelectoresFiltros();
        updateFilteredData();
        cerrarModal('nuevoModal');
        document.getElementById('nuevoForm').reset();
    }
    
    function actualizarSelectoresFiltros() {
        const iglesias = [...new Set(personas.map(p => p.iglesia))].sort();
        const ciudades = [...new Set(personas.map(p => p.ciudad))].sort();
        const modulosSet = new Set();
        personas.forEach(p => p.modulosCumplidos.split(',').forEach(m => { if(m.trim()) modulosSet.add(m.trim()); }));
        const modulos = [...modulosSet].sort();
        const filtroIglesia = document.getElementById('filtroIglesia');
        const filtroCiudad = document.getElementById('filtroCiudad');
        const filtroModulo = document.getElementById('filtroModulo');
        if (filtroIglesia) { const val = filtroIglesia.value; filtroIglesia.innerHTML = '<option value="">Todas las iglesias</option>' + iglesias.map(i => `<option value="${i}">${i}</option>`).join(''); filtroIglesia.value = val; }
        if (filtroCiudad) { const val = filtroCiudad.value; filtroCiudad.innerHTML = '<option value="">Todas las ciudades</option>' + ciudades.map(c => `<option value="${c}">${c}</option>`).join(''); filtroCiudad.value = val; }
        if (filtroModulo) { const val = filtroModulo.value; filtroModulo.innerHTML = '<option value="">Todos los módulos</option>' + modulos.map(m => `<option value="${m}">${m}</option>`).join(''); filtroModulo.value = val; }
    }
    
    function imprimirDatos(datos) { if (!datos.length) { alert("No hay registros para imprimir."); return; } const ventana = window.open('', '_blank'); ventana.document.write(generarHtmlImpresion(datos)); ventana.document.close(); ventana.print(); }
    function generarHtmlImpresion(datos) { let filas = ''; datos.forEach(p => { filas += `<tr><td>${p.numero}</td><td>${escapeHtml(p.apellido)}</td><td>${escapeHtml(p.nombre)}</td><td>${p.edad}</td><td>${escapeHtml(p.iglesia)}</td><td>${escapeHtml(p.domicilio)}</td><td>${escapeHtml(p.ciudad)}</td><td>${escapeHtml(p.perfil)}</td><td>${escapeHtml(p.observaciones)}</td><td>${escapeHtml(p.telefono || '')}</td></tr>`; }); return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Registros Iglesia</title><style>body{font-family:Inter;margin:30px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px}th{background:#334155;color:white}</style></head><body><h2>Listado de Registros</h2><p>Fecha: ${new Date().toLocaleString()}</p><table><thead><tr><th>Núm</th><th>Apellido</th><th>Nombre</th><th>Edad</th><th>Iglesia</th><th>Domicilio</th><th>Ciudad</th><th>Perfil</th><th>Observaciones</th><th>Teléfono</th></tr></thead><tbody>${filas}</tbody></table><p>Total: ${datos.length}</p></body></html>`; }
    
    function setupMobileFilters() {
        const toggleBtn = document.getElementById('toggleFiltersBtn');
        const mobileContainer = document.getElementById('mobileFiltersContainer');
        const desktopCard = document.getElementById('desktopFiltersCard');
        let isMobileOpen = false;
        if (!toggleBtn || !mobileContainer || !desktopCard) return;
        toggleBtn.addEventListener('click', () => {
            if (!isMobileOpen) {
                mobileContainer.appendChild(desktopCard);
                mobileContainer.style.display = 'block';
                isMobileOpen = true;
                toggleBtn.textContent = 'Cerrar filtros';
            } else {
                const grid = document.querySelector('.dashboard-grid');
                if (grid) grid.appendChild(desktopCard);
                mobileContainer.style.display = 'none';
                isMobileOpen = false;
                toggleBtn.textContent = 'Filtros';
            }
        });
        window.addEventListener('resize', () => {
            if (window.innerWidth > 880) {
                if (mobileContainer.contains(desktopCard)) {
                    const grid = document.querySelector('.dashboard-grid');
                    if (grid && !grid.contains(desktopCard)) grid.appendChild(desktopCard);
                }
                mobileContainer.style.display = 'none';
                isMobileOpen = false;
                if (toggleBtn) toggleBtn.textContent = 'Filtros';
            }
        });
    }

        actualizarSelectoresFiltros();

        document.getElementById('detailModal').addEventListener('click', (e) => { if (e.target === document.getElementById('detailModal')) cerrarModal('detailModal'); });
        document.getElementById('nuevoModal').addEventListener('click', (e) => { if (e.target === document.getElementById('nuevoModal')) cerrarModal('nuevoModal'); });
        setupMobileFilters();
    }
    init();
