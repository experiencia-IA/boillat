<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Agenda de Actividades</title>
    <style>
        :root {
            --primary-dark: #0b2b3f;
            --primary-main: #0b3b5f;
            --primary-hover: #0f4d73;
            --bg-app: #eef2f7;
            --bg-card: #ffffff;
            --border-color: #e9edf2;
            --text-dark: #1e2f3c;
            --text-muted: #4a6a82;
            
            --priority-low: #e8f5e9;
            --priority-medium: #fff3e0;
            --priority-high: #ffe9e9;
            --weekend-bg: #f9fbfe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { height: 100%; overflow: hidden; background: var(--bg-app); }

        .agenda-container {
            display: flex; flex-direction: column; height: 100vh; width: 100%;
            background: var(--bg-card); overflow: hidden;
        }

        .app-header { background: var(--primary-dark); padding: 0.6rem; text-align: center; color: white; }
        .app-header h1 { font-size: 1.4rem; font-weight: 600; }

        /* Barra de herramientas */
        .toolbar {
            padding: 0.8rem 1.2rem; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.5rem;
        }

        .search-input {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid #cbd5e1;
            width: 200px; font-size: 0.85rem; outline: none;
        }

        .btn-today {
            background: var(--primary-main); border: none; color: white;
            padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.85rem;
        }

        /* Calendario */
        .calendar-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1.2rem; background: #fff;
        }
        .month-year { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); }
        .nav-btn {
            background: #f1f5f9; border: none; width: 2.2rem; height: 2.2rem;
            border-radius: 50%; cursor: pointer; color: var(--primary-main); font-weight: bold;
        }

        .calendar-wrapper { flex: 1; display: flex; flex-direction: column; padding: 0 1rem 1rem; overflow: hidden; }
        .weekdays-row {
            display: grid; grid-template-columns: repeat(7, 1fr);
            background: #f8fafc; border: 1px solid var(--border-color); border-bottom: none;
            border-radius: 0.8rem 0.8rem 0 0;
        }
        .weekday { text-align: center; padding: 0.6rem; font-weight: 600; font-size: 0.75rem; color: var(--text-muted); }

        .days-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); flex: 1;
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 0 0 0.8rem 0.8rem; overflow: hidden;
        }

        .cal-day {
            border-right: 1px solid #f0f3f7; border-bottom: 1px solid #f0f3f7;
            padding: 4px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; position: relative; overflow-y: auto;
        }
        .cal-day:nth-child(7n) { border-right: none; }
        .cal-day.weekend { background: var(--weekend-bg); }
        .cal-day.empty { background: #fafafa; cursor: default; }
        .cal-day.today .day-number { background: var(--primary-main); color: white; }

        .day-number {
            width: 24px; height: 24px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; font-size: 0.8rem; font-weight: 600;
        }

        .task-dot {
            width: 6px; height: 6px; border-radius: 50%; margin-top: 2px;
        }
        .dot-high { background: #ef4444; }
        .dot-medium { background: #f59e0b; }
        .dot-low { background: #10b981; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; width: 90%; max-width: 450px; border-radius: 1.2rem;
            overflow: hidden; transform: translateY(20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header { background: var(--primary-dark); color: white; padding: 1rem; font-weight: 600; }
        .modal-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
        
        .date-time-group { display: grid; grid-template-columns: 1.5fr 1fr; gap: 0.5rem; }
        .input-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; display: block; }
        
        input, textarea, select {
            width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1;
            border-radius: 0.6rem; font-size: 0.9rem; outline: none;
        }

        .modal-footer { padding: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem; background: #f8fafc; }
        .btn { padding: 0.5rem 1.2rem; border-radius: 2rem; border: none; cursor: pointer; font-weight: 600; }
        .btn-save { background: var(--primary-main); color: white; }

        .fab {
            position: fixed; bottom: 1.5rem; right: 1.5rem; width: 56px; height: 56px;
            background: var(--primary-main); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }

        @media (max-width: 500px) {
            .date-time-group { grid-template-columns: 1fr; }
            .toolbar { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="agenda-container">
    <header class="app-header"><h1>📅 Agenda de Actividades</h1></header>
    
    <section class="toolbar">
        <button id="todayBtn" class="btn-today">Hoy</button>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar actividad...">
    </section>

    <nav class="calendar-nav">
        <button class="nav-btn" id="prevMonthBtn">←</button>
        <div class="month-year" id="monthYearDisplay"></div>
        <button class="nav-btn" id="nextMonthBtn">→</button>
    </nav>

    <main class="calendar-wrapper">
        <div class="weekdays-row" id="weekdaysRow"></div>
        <div class="days-grid" id="daysGrid"></div>
    </main>
</div>

<button class="fab" id="openModalBtn">+</button>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
        <header class="modal-header">Nueva Actividad</header>
        <div class="modal-body">
            <input type="text" id="taskTitle" placeholder="Título de la actividad">
            
            <div>
                <span class="input-label">Inicio (Fecha y Hora)</span>
                <div class="date-time-group">
                    <input type="date" id="startDate">
                    <input type="time" id="startTime">
                </div>
            </div>

            <div>
                <span class="input-label">Fin (Fecha y Hora)</span>
                <div class="date-time-group">
                    <input type="date" id="endDate">
                    <input type="time" id="endTime">
                </div>
            </div>

            <textarea id="taskDesc" rows="2" placeholder="Descripción..."></textarea>
            
            <select id="taskPriority">
                <option value="low">Prioridad Baja 🟢</option>
                <option value="medium">Prioridad Media 🟠</option>
                <option value="high">Prioridad Alta 🔴</option>
            </select>
        </div>
        <footer class="modal-footer">
            <button class="btn" id="closeModalBtn">Cancelar</button>
            <button class="btn btn-save" id="saveTaskBtn">Guardar</button>
        </footer>
    </div>
</div>

<script>
    // --- LÓGICA Y ESTADO ---
    let tasks = JSON.parse(localStorage.getItem('agenda_tasks_v2') || '[]');
    let currentDate = new Date();
    let filterText = "";

    const els = {
        daysGrid: document.getElementById('daysGrid'),
        monthYear: document.getElementById('monthYearDisplay'),
        modal: document.getElementById('modalOverlay'),
        startDate: document.getElementById('startDate'),
        startTime: document.getElementById('startTime'),
        endDate: document.getElementById('endDate'),
        endTime: document.getElementById('endTime'),
        title: document.getElementById('taskTitle'),
        desc: document.getElementById('taskDesc'),
        priority: document.getElementById('taskPriority')
    };

    // --- FORMATEADORES ---
    function formatToDMY(date) {
        return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatToHM(date) {
        return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    // --- RENDERIZADO ---
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        els.monthYear.textContent = `${monthNames[month]} ${year}`;

        document.getElementById('weekdaysRow').innerHTML = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"]
            .map(d => `<div class="weekday">${d}</div>`).join('');

        let html = "";
        const today = new Date().toISOString().split('T')[0];

        // Celdas vacías
        for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

        // Días del mes
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isToday = dateStr === today ? 'today' : '';
            const isWeekend = new Date(year, month, day).getDay() % 6 === 0 ? 'weekend' : '';
            
            // Buscar tareas que caigan en este día
            const dayTasks = tasks.filter(t => {
                const d = new Date(dateStr + 'T00:00:00');
                const start = new Date(t.start);
                const end = new Date(t.end);
                // Normalizar a fechas sin hora para la comparación del día en el calendario
                const dTime = d.getTime();
                const sTime = new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
                const eTime = new Date(end.getFullYear(), end.getMonth(), end.getDate()).getTime();
                return dTime >= sTime && dTime <= eTime;
            }).filter(t => t.title.toLowerCase().includes(filterText.toLowerCase()));

            html += `
                <div class="cal-day ${isToday} ${isWeekend}" onclick="showDayDetails('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div style="display:flex; gap:2px; flex-wrap:wrap; justify-content:center;">
                        ${dayTasks.map(t => `<div class="task-dot dot-${t.priority}"></div>`).join('')}
                    </div>
                </div>
            `;
        }
        els.daysGrid.innerHTML = html;
    }

    // --- ACCIONES TAREAS ---
    function saveTask() {
        const start = `${els.startDate.value}T${els.startTime.value || '00:00'}`;
        const end = `${els.endDate.value}T${els.endTime.value || '23:59'}`;
        
        if (!els.title.value || !els.startDate.value || !els.endDate.value) {
            alert("Por favor completa el título y las fechas.");
            return;
        }

        if (new Date(start) > new Date(end)) {
            alert("La fecha de inicio no puede ser posterior a la de fin.");
            return;
        }

        tasks.push({
            id: Date.now(),
            title: els.title.value,
            desc: els.desc.value,
            start, end,
            priority: els.priority.value
        });

        localStorage.setItem('agenda_tasks_v2', JSON.stringify(tasks));
        closeModal();
        renderCalendar();
    }

    function showDayDetails(dateStr) {
        const dayTasks = tasks.filter(t => {
            const d = new Date(dateStr + 'T00:00:00').getTime();
            const s = new Date(new Date(t.start).toDateString()).getTime();
            const e = new Date(new Date(t.end).toDateString()).getTime();
            return d >= s && d <= e;
        });

        if (dayTasks.length === 0) {
            openModal(dateStr);
            return;
        }

        const list = dayTasks.map(t => `
            <div style="border-bottom:1px solid #eee; padding:10px 0;">
                <strong>${t.title}</strong><br>
                <small>📅 Inicia: ${formatToDMY(new Date(t.start))} ${formatToHM(new Date(t.start))}</small><br>
                <small>🏁 Termina: ${formatToDMY(new Date(t.end))} ${formatToHM(new Date(t.end))}</small><br>
                <p style="font-size:0.8rem; color:#666;">${t.desc || ''}</p>
                <button onclick="deleteTask(${t.id})" style="color:red; border:none; background:none; cursor:pointer; font-size:0.7rem;">Eliminar 🗑️</button>
            </div>
        `).join('');

        const detailDiv = document.createElement('div');
        detailDiv.className = 'modal-overlay active';
        detailDiv.innerHTML = `
            <div class="modal-card">
                <header class="modal-header">Actividades - ${formatToDMY(new Date(dateStr + 'T00:00:00'))}</header>
                <div class="modal-body" style="max-height:400px; overflow-y:auto;">${list}</div>
                <footer class="modal-footer">
                    <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cerrar</button>
                    <button class="btn btn-save" onclick="this.closest('.modal-overlay').remove(); openModal('${dateStr}')">Añadir</button>
                </footer>
            </div>
        `;
        document.body.appendChild(detailDiv);
    }

    function deleteTask(id) {
        if (!confirm("¿Eliminar actividad?")) return;
        tasks = tasks.filter(t => t.id !== id);
        localStorage.setItem('agenda_tasks_v2', JSON.stringify(tasks));
        document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
        renderCalendar();
    }

    // --- MODAL ---
    function openModal(dateStr = null) {
        els.title.value = "";
        els.desc.value = "";
        const defaultDate = dateStr || new Date().toISOString().split('T')[0];
        els.startDate.value = defaultDate;
        els.endDate.value = defaultDate;
        els.startTime.value = "09:00";
        els.endTime.value = "10:00";
        els.modal.classList.add('active');
    }

    function closeModal() { els.modal.classList.remove('active'); }

    // --- EVENTOS ---
    document.getElementById('openModalBtn').onclick = () => openModal();
    document.getElementById('closeModalBtn').onclick = closeModal;
    document.getElementById('saveTaskBtn').onclick = saveTask;
    document.getElementById('prevMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
    document.getElementById('nextMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
    document.getElementById('todayBtn').onclick = () => { currentDate = new Date(); renderCalendar(); };
    document.getElementById('searchInput').oninput = (e) => { filterText = e.target.value; renderCalendar(); };

    // Inicio
    renderCalendar();
</script>
</body>
</html>
