<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Misiones - Mapa Estratégico Político</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --gm-bg: #ffffff;
            --gm-text: #202124;
            --gm-text-secondary: #70757a;
            --gm-blue-dark: #0d47a1;
            --gm-blue-shade: #1a73e8;
            --gm-border: #dadce0;
            --gm-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif; }

        #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; background: #e5e3df; }

        #side-panel {
            position: absolute; top: 0; left: 0; width: 408px; height: 100vh;
            background: var(--gm-bg); z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }

        .right-strip {
            position: fixed; right: 0; top: 0; bottom: 0; width: 45px;
            background: rgba(255, 255, 255, 0.9); z-index: 1001;
            display: flex; align-items: center; justify-content: center;
            border-left: 1px solid var(--gm-border); pointer-events: none;
        }
        .vertical-text {
            writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
            font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 18px;
            color: var(--gm-blue-dark); letter-spacing: 4px; text-transform: uppercase;
        }

        .search-container { padding: 8px 16px; background: var(--gm-bg); }
        .search-bar {
            display: flex; align-items: center; background: var(--gm-bg);
            border-radius: 24px; box-shadow: var(--gm-shadow);
            padding: 0 16px; height: 48px; margin-top: 8px;
        }
        .search-bar input { border: none; outline: none; flex: 1; font-size: 16px; margin-left: 12px; }

        #panel-content { flex: 1; overflow-y: auto; }

        .city-item { display: flex; align-items: center; padding: 12px 24px; cursor: pointer; border-bottom: 1px solid #f1f3f4; }
        .city-item:hover { background: #f8f9fa; }

        /* Detalle y Botones */
        .detail-header { height: 140px; background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%); position: relative; }
        .header-actions { position: absolute; top: 16px; width: calc(100% - 32px); left: 16px; display: flex; justify-content: space-between; }
        .circle-btn { background: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--gm-shadow); color: var(--gm-blue-dark); border: none; }
        
        .detail-body { padding: 24px; }
        .detail-title { font-family: 'Google Sans', sans-serif; font-size: 24px; margin-bottom: 4px; }
        .stats-grid { display: flex; flex-direction: column; gap: 4px; margin-top: 15px; }
        .stat-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f8f9fa; }
        .stat-row .material-icons-outlined { color: var(--gm-blue-shade); margin-right: 16px; font-size: 20px; }
        .stat-label { flex: 1; font-size: 14px; }
        .stat-value { font-weight: 700; color: var(--gm-blue-dark); }

        .map-controls { position: absolute; bottom: 24px; right: 60px; z-index: 1000; }
        .fab { width: 40px; height: 40px; background: white; border-radius: 8px; box-shadow: var(--gm-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        @media (max-width: 768px) {
            #side-panel { width: 100vw; height: 45vh; top: auto; bottom: 0; }
            .map-controls { bottom: calc(45vh + 16px); right: 40px; }
        }

        /* Estilos para impresión */
        @media print {
            .print-only { display: block !important; font-family: sans-serif; padding: 40px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="map" class="no-print"></div>

    <div id="side-panel" class="no-print">
        <div class="search-container">
            <div class="search-bar">
                <span class="material-icons-outlined">menu</span>
                <input type="text" id="city-search" placeholder="Buscar ciudad..." oninput="filterCities(this.value)">
                <span class="material-icons-outlined" style="color:var(--gm-blue-shade); cursor:pointer;" onclick="resetSearch()">close</span>
            </div>
        </div>
        <div id="panel-content"></div>
    </div>

    <div class="right-strip no-print">
        <div class="vertical-text">Misiones - Argentina</div>
    </div>

    <div class="map-controls no-print">
        <div class="fab" onclick="resetView()"><span class="material-icons-outlined">my_location</span></div>
    </div>

    <script>
        const misionesCities = [
            { name: "Posadas", dept: "Capital", coords: [-27.367, -55.896], pastores: 52, multiplicadores: 21, discipuladores: 180, plantadores: 14, mentores: 18, nuevosCreyentes: 600, nuevasIglesias: 9 },
            { name: "Garupá", dept: "Capital", coords: [-27.483, -55.833], pastores: 18, multiplicadores: 7, discipuladores: 55, plantadores: 4, mentores: 6, nuevosCreyentes: 210, nuevasIglesias: 3 },
            { name: "Puerto Iguazú", dept: "Iguazú", coords: [-25.599, -54.573], pastores: 25, multiplicadores: 10, discipuladores: 82, plantadores: 6, mentores: 8, nuevosCreyentes: 280, nuevasIglesias: 5 },
            { name: "Wanda", dept: "Iguazú", coords: [-25.967, -54.567], pastores: 9, multiplicadores: 3, discipuladores: 32, plantadores: 2, mentores: 3, nuevosCreyentes: 90, nuevasIglesias: 1 },
            { name: "Eldorado", dept: "Eldorado", coords: [-26.400, -54.617], pastores: 31, multiplicadores: 12, discipuladores: 98, plantadores: 7, mentores: 9, nuevosCreyentes: 340, nuevasIglesias: 6 },
            { name: "Oberá", dept: "Oberá", coords: [-27.485, -55.120], pastores: 38, multiplicadores: 15, discipuladores: 125, plantadores: 9, mentores: 11, nuevosCreyentes: 450, nuevasIglesias: 7 },
            { name: "San Vicente", dept: "Guaraní", coords: [-27.017, -54.467], pastores: 19, multiplicadores: 8, discipuladores: 62, plantadores: 5, mentores: 7, nuevosCreyentes: 190, nuevasIglesias: 3 },
            { name: "El Soberbio", dept: "Guaraní", coords: [-27.298, -54.197], pastores: 14, multiplicadores: 6, discipuladores: 45, plantadores: 3, mentores: 5, nuevosCreyentes: 140, nuevasIglesias: 2 },
            { name: "Aristóbulo del Valle", dept: "Cainguás", coords: [-27.094, -54.894], pastores: 16, multiplicadores: 6, discipuladores: 58, plantadores: 4, mentores: 5, nuevosCreyentes: 170, nuevasIglesias: 2 },
            { name: "Bernardo de Irigoyen", dept: "Gral. Belgrano", coords: [-26.255, -53.645], pastores: 13, multiplicadores: 5, discipuladores: 42, plantadores: 3, mentores: 5, nuevosCreyentes: 135, nuevasIglesias: 2 },
            { name: "Andresito", dept: "Gral. Belgrano", coords: [-25.672, -54.045], pastores: 15, multiplicadores: 6, discipuladores: 48, plantadores: 4, mentores: 6, nuevosCreyentes: 160, nuevasIglesias: 2 },
            { name: "Apóstoles", dept: "Apóstoles", coords: [-27.915, -55.755], pastores: 18, multiplicadores: 7, discipuladores: 65, plantadores: 4, mentores: 6, nuevosCreyentes: 200, nuevasIglesias: 3 },
            { name: "San Pedro", dept: "San Pedro", coords: [-26.623, -54.108], pastores: 15, multiplicadores: 6, discipuladores: 50, plantadores: 4, mentores: 5, nuevosCreyentes: 155, nuevasIglesias: 2 },
            { name: "Montecarlo", dept: "Montecarlo", coords: [-26.567, -54.750], pastores: 17, multiplicadores: 7, discipuladores: 58, plantadores: 4, mentores: 6, nuevosCreyentes: 170, nuevasIglesias: 2 },
            { name: "Jardín América", dept: "San Ignacio", coords: [-27.042, -55.228], pastores: 15, multiplicadores: 6, discipuladores: 52, plantadores: 3, mentores: 5, nuevosCreyentes: 160, nuevasIglesias: 2 },
            { name: "Leandro N. Alem", dept: "L. N. Alem", coords: [-27.603, -55.323], pastores: 22, multiplicadores: 9, discipuladores: 78, plantadores: 5, mentores: 7, nuevosCreyentes: 230, nuevasIglesias: 4 }
        ];

        const bounds = [[-28.15, -56.3], [-25.5, -53.4]];
        const map = L.map('map', { zoomControl: false, maxBounds: bounds, minZoom: 7.5 }).fitBounds(bounds);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        // Capa de Frontera y Sombreado
        fetch('https://raw.githubusercontent.com/mgfranco/geojson-argentina/master/provincias/misiones.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: "#0d47a1", weight: 6, fillColor: "#1a73e8", fillOpacity: 0.18 }
                }).addTo(map);
            });

        const panel = document.getElementById('panel-content');
        const searchInput = document.getElementById('city-search');

        misionesCities.forEach(city => {
            L.circleMarker(city.coords, { radius: 6, fillColor: "#EA4335", color: "#fff", weight: 2, fillOpacity: 1 })
            .addTo(map).on('click', () => showDetail(city));
        });

        function renderList(list) {
            let html = `<div style="padding:16px 24px; font-size:12px; color:var(--gm-text-secondary); font-weight:700;">CIUDADES EN MISIONES</div>`;
            list.sort((a,b) => a.name.localeCompare(b.name)).forEach(city => {
                html += `
                    <div class="city-item" onclick="showDetailByName('${city.name}')">
                        <span class="material-icons-outlined" style="margin-right:15px; color:#70757a">place</span>
                        <div>
                            <div class="city-name">${city.name}</div>
                            <div class="city-dept">Depto. ${city.dept}</div>
                        </div>
                    </div>`;
            });
            panel.innerHTML = html;
        }

        function showDetail(city) {
            const isMobile = window.innerWidth <= 768;
            map.flyTo(city.coords, 12, { paddingTopLeft: isMobile ? [0, window.innerHeight * 0.45] : [408, 0] });
            
            panel.innerHTML = `
                <div class="detail-header">
                    <div class="header-actions">
                        <button class="circle-btn" onclick="renderList(misionesCities)"><span class="material-icons-outlined">arrow_back</span></button>
                        <button class="circle-btn" onclick="printResults('${city.name}')"><span class="material-icons-outlined">print</span></button>
                    </div>
                </div>
                <div class="detail-body">
                    <div class="detail-title">${city.name}</div>
                    <div style="color:var(--gm-text-secondary); font-size:14px; margin-bottom:15px;">Misiones, Argentina</div>
                    <div class="stats-grid" id="stats-to-print">
                        ${stat('person', 'Pastores', city.pastores)}
                        ${stat('hub', 'Multiplicadores', city.multiplicadores)}
                        ${stat('groups', 'Discipuladores', city.discipuladores)}
                        ${stat('agriculture', 'Plantadores', city.plantadores)}
                        ${stat('psychology', 'Mentores', city.mentores)}
                        ${stat('volunteer_activism', 'Nuevos Creyentes', city.nuevosCreyentes)}
                        ${stat('church', 'Nuevas Iglesias', city.nuevasIglesias)}
                    </div>
                </div>`;
        }

        function stat(icon, label, val) {
            return `<div class="stat-row">
                <span class="material-icons-outlined">${icon}</span>
                <span class="stat-label">${label}</span>
                <span class="stat-value">${val}</span>
            </div>`;
        }

        function printResults(cityName) {
            const city = misionesCities.find(c => c.name === cityName);
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Reporte - ${city.name}</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: #333; }
                        h1 { color: #0d47a1; border-bottom: 2px solid #0d47a1; padding-bottom: 10px; }
                        .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 1.2em; }
                        .val { font-weight: bold; color: #0d47a1; }
                        .footer { margin-top: 50px; font-size: 0.8em; color: #777; text-align: center; }
                    </style>
                </head>
                <body>
                    <p>PROVINCIA DE MISIONES - ARGENTINA</p>
                    <h1>${city.name} (Depto. ${city.dept})</h1>
                    <div class="stat"><span>Pastores</span> <span class="val">${city.pastores}</span></div>
                    <div class="stat"><span>Multiplicadores</span> <span class="val">${city.multiplicadores}</span></div>
                    <div class="stat"><span>Discipuladores</span> <span class="val">${city.discipuladores}</span></div>
                    <div class="stat"><span>Plantadores</span> <span class="val">${city.plantadores}</span></div>
                    <div class="stat"><span>Mentores</span> <span class="val">${city.mentores}</span></div>
                    <div class="stat"><span>Nuevos Creyentes</span> <span class="val">${city.nuevosCreyentes}</span></div>
                    <div class="stat"><span>Nuevas Iglesias</span> <span class="val">${city.nuevasIglesias}</span></div>
                    <div class="footer">Documento generado el ${new Date().toLocaleDateString()}</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        function filterCities(q) {
            const filtered = misionesCities.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
            renderList(filtered);
        }

        function showDetailByName(name) {
            const city = misionesCities.find(c => c.name === name);
            if(city) showDetail(city);
        }

        function resetSearch() { searchInput.value = ''; renderList(misionesCities); resetView(); }
        function resetView() { map.flyToBounds(bounds); }

        renderList(misionesCities);
    </script>
</body>
</html>
